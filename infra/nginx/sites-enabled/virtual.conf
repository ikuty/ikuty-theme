server {
    listen 80;
    server_name _;
    
    # Let's Encrypt challenge location
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;
    
    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/ikuty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ikuty.com/privkey.pem;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # Document root
    root /var/www/html;
    index index.php index.html index.htm;
    
    # Block access to WordPress REST API
    location ~ ^/wp-json/ {
        deny all;
        return 403;
    }
    
    # Block access to XML-RPC
    location = /xmlrpc.php {
        deny all;
        return 403;
    }
    
    # Rate limiting for login
    location ~ /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }
    
    # Rate limiting for general requests
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }
    
    # PHP processing
    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Security: Block access to sensitive files
    location ~ /\.ht {
        return 404;
    }
    
    location ~ /\. {
        return 404;
    }
    
    location ~ /wp-config.php {
        return 404;
    }
    
    # WordPress security
    location ~ ^/wp-content/uploads/.*\.(php|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
        return 404;
    }
    
    # Protect wp-includes
    location ~ ^/wp-includes/(.*\.php)$ {
        return 404;
    }
    
    # Block WordPress brute force attempts
    location ~ ^/(wp-admin|wp-login\.php) {
        # allow 127.0.0.1;
        # Add your IP addresses here
        # allow YOUR_IP_ADDRESS;
        # deny all;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }
}