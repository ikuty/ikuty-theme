services:
  nginx:
    image: nginx:alpine
    container_name: wordpress-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wp_data:/var/www/html
      - ssl_certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
      - certbot_webroot:/var/www/certbot:ro
      - php_socket:/var/run
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - wordpress
    networks:
      - wordpress-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  wordpress:
    build: ./docker/wordpress
    container_name: wordpress-app
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    volumes:
      - wp_data:/var/www/html
      - ./php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./php/zzz-socket.conf:/usr/local/etc/php-fpm.d/zzz-socket.conf:ro
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - php_socket:/var/run
    depends_on:
      - mysql
    networks:
      - wordpress-network

  mysql:
    image: mysql:8.4
    container_name: wordpress-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - wordpress-network
    command: --mysql-native-password=ON

  certbot:
    image: certbot/certbot
    container_name: wordpress-certbot
    restart: "no"
    # tools プロファイルに分離し、`docker compose up -d` の対象から除外する。
    # 証明書の発行/更新は ssl-init.sh / ssl-renew.sh が `docker compose run --rm certbot ...`
    # で明示的に呼び出す運用のため、up -d のたびに certonly が走ってLet's Encryptの
    # レート制限(週5回)を消費する事故を防ぐ。
    profiles:
      - tools
    volumes:
      - ssl_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - wordpress-network
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN_NAME}

volumes:
  wp_data:
    driver: local
  db_data:
    driver: local
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local
  certbot_webroot:
    driver: local
  php_socket:
    driver: local

networks:
  wordpress-network:
    driver: bridge
