# http コンテキストの共通設定。
# nginx.conf はイメージ標準のものを使い(docker-compose.yml でマウントしない)、イメージ標準の
# nginx.conf が http 内で include する /etc/nginx/conf.d/*.conf としてこのファイルを読み込む。
# nginx.conf をファイル単位でマウントすると、git reset などでファイルが置き換わったときに
# コンテナが古い内容を見続けるため、ディレクトリ単位でマウントして nginx -s reload だけで反映できるようにしている。
#
# イメージ標準の nginx.conf が既に設定している次のものは、ここに書かない(単一値のディレクティブは
# 重複するとエラーになるため)。値を変えたい場合は、ここではなくイメージ標準側との差分を確認すること。
#   mime.types、default_type、log_format main、access_log、sendfile、keepalive_timeout 65

charset utf-8;

# イメージ標準の error_log は notice。http 内のログだけ warn にそろえる
error_log /var/log/nginx/error.log warn;

# Performance settings
tcp_nopush on;
tcp_nodelay on;
types_hash_max_size 2048;
server_tokens off;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/svg+xml
    image/x-icon
    text/css
    text/plain
    text/x-component;

# SSL Settings
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
# OCSP stapling は設定しない。現在の証明書にはOCSPレスポンダのURLが含まれず、
# ssl_stapling on; にしても無視されて警告が出るだけのため

# Rate limiting
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Client settings
client_max_body_size 64M;
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 4k;

# サイトごとの設定。glob(*.conf)にしないこと。
# 読み込み順で、443番ポートの既定のserverブロックが決まる(最初に読んだものが既定になる)。
# virtual.conf(server_name _ で全ホストを受ける WordPress)を先に読ませ、
# 専用のホスト名を持つ test-mcp.conf を後に読ませる。アルファベット順だと test-mcp.conf が先になり、
# 未知のホスト名やIP直打ちのアクセスがMCPのブロックに入ってしまう。
# 新しいサイトを追加するときは、ここに include を追加する。
include /etc/nginx/sites-enabled/virtual.conf;
include /etc/nginx/sites-enabled/test-mcp.conf;
