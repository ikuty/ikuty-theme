# mart-mcp(MCPサーバ)専用の server ブロック。WordPress 側(virtual.conf)とは分離している。
# - Anthropic の送信元IPだけを許可する(claude.ai / モバイルからの接続はここから来る)
# - リクエスト本文は記録しない(virtual.conf の実験用本文ログの対象外)
# - proxy_pass を変数にして実行時に名前解決する: mart-mcp コンテナが居なくても nginx が起動できる
#   (静的に書くと、コンテナ不在時に nginx 全体が起動に失敗して WordPress も止まる)
server {
    listen 443 ssl;
    http2 on;
    server_name test.ikuty.com;

    ssl_certificate /etc/letsencrypt/live/test.ikuty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.ikuty.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff;

    allow 160.79.104.0/21;
    deny all;

    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /mcp {
        set $mart_mcp http://mart-mcp:8000;
        proxy_pass $mart_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1m;
    }

    location / {
        return 404;
    }
}
